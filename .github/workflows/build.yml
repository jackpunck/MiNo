name: 构建

# 开发机没有 Rust 工具链，所以对任何本地改动的验证都只能在这里做。
# 第一个 job 只做 cargo check + cargo test —— 编译报错在这里看最快，而且比完整
# 打包快得多、错也更好读。出包放在第二个 job，只在打 tag 或手动触发时跑。
#
# 注意 check 绿了只代表「能编译」：它不链接、不打包、更不运行程序。
# 窗口行为（透明、边缘吸附、托盘、全局快捷键）必须实机验证。
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# 同一分支连续推送时，取消上一次还没跑完的任务
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

# 日常验证只读；仅两个上传 Release 的 job 申请写权限。
permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # 类型检查：日常反馈靠这个
  # ---------------------------------------------------------------------------
  check:
    name: cargo check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 前端没有任何构建步骤：`tauri build` 只是把 ui/ 原样嵌进二进制，不做解析。
      # 一个 JS 语法错误会**静默地**进安装包，表现成白屏（body.loading 永远揭不开，
      # 2 秒后由 revealTimer 兜底揭开一个空界面）。这是本仓库最大的验证盲区。
      #
      # package.json 里标了 "type": "module"，所以 node 会把 ui/*.js 按 ESM 解析。
      - name: 前端静态检查
        shell: bash
        run: |
          for f in ui/*.js; do
            node --check "$f"
          done
          node tools/check-commands.mjs
          node tools/check-version.mjs
          node --test tools/generate-android-update.test.mjs

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: 缓存 Rust 构建产物
        uses: Swatinem/rust-cache@v2
        with:
          # 格式是「工作区路径 -> 产物目录」
          workspaces: "src-tauri -> target"

      # 不加 --locked：仓库里还没有 Cargo.lock（本地没有 cargo，生成不了）。
      # 首次本地构建成功后，建议把 Cargo.lock 提交进来，再把 --locked 打开。
      - name: cargo check
        working-directory: src-tauri
        run: cargo check --all-targets

      - name: cargo test
        working-directory: src-tauri
        run: cargo test

  # ---------------------------------------------------------------------------
  # Android：每日待办 + 提醒通知
  #
  # 独立原生 Android 验证线：不加载 WebView，不复制桌面 ui/。
  # 单测/lint/打包仍不代表真实手机上的提醒和内存验收。
  # ---------------------------------------------------------------------------
  android:
    name: Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: 安装 Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false

      - name: 缓存 Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: 单测 + lint + 优化验收包
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleBenchmark :app:assembleDebugAndroidTest
          sha256sum app/build/outputs/apk/benchmark/*.apk
          stat --format='%n %s bytes' app/build/outputs/apk/benchmark/*.apk

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: MiNo-Android
          path: android/app/build/outputs/apk/benchmark/*.apk
          if-no-files-found: error

      - name: 上传 Android 检查报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MiNo-Android-reports
          path: |
            android/app/build/reports/tests/
            android/app/build/reports/lint-results-debug.*
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # Android 正式包：只在 tag 上使用正式密钥，绝不拿 benchmark 充当 release。
  # ---------------------------------------------------------------------------
  android-release:
    name: Android 正式签名
    needs: [check, android]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    env:
      ANDROID_VERSION_NAME: ${{ vars.ANDROID_VERSION_NAME }}
      ANDROID_VERSION_CODE: ${{ vars.ANDROID_VERSION_CODE }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 解析 Android 版本
        shell: bash
        run: |
          # 未配置 repository variable 时按默认版本处理；Gradle/生成器本身拒绝空覆盖。
          if [ -z "$ANDROID_VERSION_NAME" ]; then unset ANDROID_VERSION_NAME; fi
          if [ -z "$ANDROID_VERSION_CODE" ]; then unset ANDROID_VERSION_CODE; fi
          node --input-type=module <<'NODE'
          import { readFileSync, appendFileSync } from 'node:fs';
          import { resolveVersion } from './tools/generate-android-update.mjs';
          assertTag(process.env.GITHUB_REF_NAME);
          function assertTag(tag) {
            if (!/^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$/.test(tag)) {
              throw new Error('Android release requires a stable vX.Y.Z tag');
            }
          }
          const desktop = JSON.parse(readFileSync('src-tauri/tauri.conf.json', 'utf8')).version;
          const version = resolveVersion(desktop);
          appendFileSync(process.env.GITHUB_ENV, `ANDROID_VERSION_NAME=${version.versionName}\nANDROID_VERSION_CODE=${version.versionCode}\n`);
          NODE

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false

      - uses: gradle/actions/setup-gradle@v4

      - name: 检查密钥并构建正式 APK
        shell: bash
        env:
          MINO_KEYSTORE_BASE64: ${{ secrets.MINO_KEYSTORE_BASE64 }}
          MINO_KEYSTORE_PASSWORD: ${{ secrets.MINO_KEYSTORE_PASSWORD }}
          MINO_KEY_ALIAS: ${{ secrets.MINO_KEY_ALIAS }}
          MINO_KEY_PASSWORD: ${{ secrets.MINO_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          # 不启用 shell tracing；报错只打印缺失的名称。
          for name in MINO_KEYSTORE_BASE64 MINO_KEYSTORE_PASSWORD MINO_KEY_ALIAS MINO_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing required Android release secret: $name"
              exit 1
            fi
          done
          export MINO_KEYSTORE_PATH="$RUNNER_TEMP/mino-release.jks"
          trap 'rm -f -- "$MINO_KEYSTORE_PATH"' EXIT
          umask 077
          printf '%s' "$MINO_KEYSTORE_BASE64" | base64 --decode > "$MINO_KEYSTORE_PATH"
          test -s "$MINO_KEYSTORE_PATH"
          unset MINO_KEYSTORE_BASE64
          chmod +x android/gradlew
          cd android
          ./gradlew --no-daemon --no-configuration-cache :app:assembleRelease

      - name: 清理临时签名材料
        if: always()
        shell: bash
        run: rm -f -- "$RUNNER_TEMP/mino-release.jks"

      - name: 校验签名与 APK 信息，生成更新元数据
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          apk=android/app/build/outputs/apk/release/app-release.apk
          sdk_tools="$ANDROID_HOME/build-tools/35.0.0"
          "$sdk_tools/apksigner" verify --verbose "$apk"
          "$sdk_tools/aapt" dump badging "$apk" > "$RUNNER_TEMP/mino-apk-badging.txt"
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          const badging = readFileSync(`${process.env.RUNNER_TEMP}/mino-apk-badging.txt`, 'utf8');
          const pkg = badging.match(/^package: name='com\.mino\.app' versionCode='(\d+)' versionName='([^']+)'/m);
          assert.ok(pkg, 'Expected MiNo release package');
          assert.equal(pkg[1], process.env.ANDROID_VERSION_CODE, 'APK versionCode mismatch');
          assert.equal(pkg[2], process.env.ANDROID_VERSION_NAME, 'APK versionName mismatch');
          assert.match(badging, /^sdkVersion:'26'$/m, 'APK minSdk mismatch');
          NODE
          mkdir -p "$RUNNER_TEMP/mino-android-release"
          target="$RUNNER_TEMP/mino-android-release/MiNo_android_${ANDROID_VERSION_NAME}.apk"
          cp "$apk" "$target"
          node tools/generate-android-update.mjs --apk "$target" \
            --output "$RUNNER_TEMP/mino-android-release/android-update.json" \
            --tag "$RELEASE_TAG" --notes "MiNo Android ${ANDROID_VERSION_NAME}"

      - uses: actions/upload-artifact@v4
        with:
          name: MiNo-Android-release
          path: |
            ${{ runner.temp }}/mino-android-release/*.apk
            ${{ runner.temp }}/mino-android-release/android-update.json
          if-no-files-found: error

  # 等 Windows 创建完同一个 Release 再追加 Android assets，避免并行创建冲突。
  android-publish:
    name: 上传 Android Release
    needs: [build, android-release]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: MiNo-Android-release
          path: android-release

      - uses: softprops/action-gh-release@v2
        with:
          fail_on_unmatched_files: true
          files: android-release/MiNo_android_*.apk

      # Make an update discoverable only after its APK upload has succeeded.
      - uses: softprops/action-gh-release@v2
        with:
          fail_on_unmatched_files: true
          files: android-release/android-update.json

  # ---------------------------------------------------------------------------
  # Windows 出包：打 tag 或手动触发
  # ---------------------------------------------------------------------------
  build:
    name: 打包
    needs: check
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    permissions:
      # 打 tag 时创建 Release 需要它
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: 缓存 Rust 构建产物
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      # 仓库里没有 package-lock.json，所以只能 npm install（npm ci 会直接报错）。
      # 这一句只是为了拿到 @tauri-apps/cli，没有前端构建步骤。
      - name: 安装 Tauri CLI
        run: npm install

      - name: 打包
        run: npm run build

      - name: 上传安装包
        uses: actions/upload-artifact@v4
        with:
          name: MiNo-安装包
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: 上传便携版
        uses: actions/upload-artifact@v4
        with:
          name: MiNo-便携版
          path: src-tauri/target/release/MiNo.exe
          if-no-files-found: error

      # 推一个 v0.1.0 这样的 tag，就把安装包挂到 Release 上 —— 那个页面链接
      # 就是可以直接发给别人的东西
      - name: 发布 Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/MiNo.exe
          generate_release_notes: true
