[package]
name = "mino"
version = "0.2.0"
description = "MiNo - 常驻桌面的极简今日待办浮窗"
edition = "2021"
rust-version = "1.77.2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"

# 仅用于把前端上传的字体/背景字节解码出原始二进制
base64 = "0.22"

# 只为一件事：判断前台窗口是不是铺满整块显示器的全屏程序（感应条的悬停门控，
# 见 window::foreground_is_fullscreen）。浏览器里看不到别的窗口，这件事只有
# Win32 知道。
#
# 用 windows-sys 而不是 `windows` crate：这里只要三个查询函数，原始 FFI 的签名
# 跨版本稳定，不需要 Result 包装、也不需要为每个结构体准备 Default。
# features 精确到用到的三个模块，不要图省事开 "all" —— 那会把整棵 Win32 绑定的
# 编译时间都算进来。
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

# 枚举系统已安装字体族。Windows 上走 DirectWrite，与 WebView2 解析 CSS font-family
# 使用的是同一套字体库，因此返回的名字能直接用于 CSS。
font-kit = "0.14"

# 日志 facade。后端实现是自带的 logging.rs（写文件），不是 env_logger ——
# 那个只写 stderr，release 构建下 stderr 无处可去，装出来的包里一行都没有。
#
# `features = ["std"]` 不能省：log 0.4 的 [features] 里**没有 default**，
# 裸写 `log = "0.4"` 等于 std 关闭，`set_boxed_logger` 会被 cfg 掉（它门控在
# alloc 上，而 `std = ["alloc"]`）。以前这里不需要显式开，是因为 env_logger
# 依赖 `log/std`、Cargo 的 feature 合并顺带开了 —— 删掉 env_logger 之后
# 没人开它了，这就是「删一个依赖会悄悄改掉另一个依赖的 feature 集」的实例。
log = { version = "0.4", features = ["std"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
