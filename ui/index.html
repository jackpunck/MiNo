<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MiNo</title>
  <!--
    必须在样式表之前、且是阻塞式普通脚本（不能是 module / defer）：
    它要在首次绘制前把上次用的字体链写进 CSS 变量，否则会先闪一下默认字体。
    CSP 是 script-src 'self'，所以只能放在独立文件里，不能用内联脚本。
  -->
  <script src="boot.js"></script>
  <link rel="stylesheet" href="styles.css">
</head>
<!-- class="loading" 先把内容挡住，等 app.js 把字体备好再揭开，避免字体跳变 -->
<body class="loading">
  <!-- 自定义背景图层，始终位于内容之下。
       三层结构见 styles.css 的 #bg：模糊填充 / 完整图片 / 遮罩。 -->
  <div id="bg" aria-hidden="true">
    <div class="bg-layer bg-blur"></div>
    <div class="bg-layer bg-image"></div>
    <div class="bg-layer bg-mask"></div>
  </div>

  <div id="app">
    <!--
      data-tauri-drag-region 要挂在**真正被点到的那个元素**上，光挂在 header 上不够：
      Tauri 判断的是事件目标自身带不带这个属性，而 .title 是 flex:1、盖住了标题栏
      中段，于是能拖的只剩左右两端几个像素的 padding —— 这就是「拖动困难」的根因。
      现在 .grip 和 .title 各带一份，标题栏上除按钮之外的每一像素都可拖。
      .actions 里的按钮**一个都不能加**：它们有自己的点击语义，变成拖拽区就点不动了。
    -->
    <header class="titlebar" data-tauri-drag-region>
      <span class="grip" aria-hidden="true" data-tauri-drag-region>⋯</span>
      <span class="title" data-tauri-drag-region>MiNo</span>
      <div class="actions">
        <button id="btn-bg" class="icon-btn" title="更换背景" aria-label="更换背景">🖼</button>
        <button id="btn-settings" class="icon-btn" title="设置" aria-label="打开设置">⚙</button>
        <button id="btn-pin" class="icon-btn" title="窗口置顶" aria-label="切换窗口置顶" aria-pressed="true">📌</button>
        <!-- 图标用 U+2014 而不是 ⤡ 之类的箭头：Segoe UI 里那些很可能是豆腐块 -->
        <button id="btn-min" class="icon-btn" title="最小化（收缩到屏幕边缘）" aria-label="最小化">—</button>
        <button id="btn-hide" class="icon-btn" title="隐藏窗口 (Esc)" aria-label="隐藏窗口">✕</button>
      </div>
    </header>

    <div class="input-row">
      <input
        id="input"
        type="text"
        placeholder="+ 输入今日任务，回车添加..."
        autocomplete="off"
        spellcheck="false"
        aria-label="新任务">
    </div>

    <ul id="list" class="list" aria-label="今日任务"></ul>

    <footer class="footer">
      <span id="progress" class="progress">进度: 0/0</span>
      <button id="btn-clear" class="text-btn">清空已完成</button>
    </footer>
  </div>

  <!-- 设置面板 -->
  <section id="settings" class="settings" hidden aria-label="设置">
    <!--
      设置面板是 position:fixed; inset:0; z-index:20，打开时整条标题栏都被它盖住，
      窗口就完全没法拖了。所以面板自己的头部也要能拖 —— 属性同样要挂在被点到的
      元素上（.settings-head 和里面那个 span）。**面板主体绝不能加**：那里面有
      搜索框、滑块和可滚动区域，拖拽区会把它们的交互全抢走。
    -->
    <header class="settings-head" data-tauri-drag-region>
      <span data-tauri-drag-region>设置</span>
      <button id="btn-settings-close" class="icon-btn" title="关闭设置" aria-label="关闭设置">✕</button>
    </header>

    <div class="settings-body">
      <!--
        「新任务」而不是「便签文字」：每条任务会把自己创建时的字体记下来，
        改这里只影响此后新建的任务。措辞必须说清这件事，否则用户会以为
        选了字体就全局生效。
      -->
      <div class="field-label">新任务字体</div>

      <div class="font-current" id="font-current">默认字体</div>

      <input id="font-search" class="search" type="text" placeholder="搜索字体..." autocomplete="off" aria-label="搜索字体">

      <!--
        这里刻意不用原生 <select>：在 Windows 上展开的下拉列表由系统绘制，
        会忽略 <option> 上的 font-family，字体预览全部失效。
      -->
      <div id="font-list" class="font-list" role="listbox" aria-label="字体列表"></div>

      <div class="settings-actions">
        <button id="btn-font-import" class="btn">导入字体文件…</button>
        <button id="btn-font-reset" class="btn">恢复默认字体</button>
        <button id="btn-font-apply-all" class="btn">应用到全部任务</button>
      </div>
      <div class="hint">改字体只影响新建的任务，已有的保持原样。</div>

      <div class="divider"></div>

      <div class="field-label">背景</div>
      <div class="settings-actions">
        <button id="btn-bg-import" class="btn">选择背景图片…</button>
        <button id="btn-bg-reset" class="btn">恢复默认背景</button>
      </div>

      <div class="field-label">文字颜色</div>
      <!-- 色块由 appearance.js 的 TEXT_COLORS 生成，这里只留容器 -->
      <div id="color-swatches" class="swatches" role="radiogroup" aria-label="文字颜色"></div>

      <!--
        这两行是互斥的，appearance.js 会按当前有没有自定义图片切换：
        没有图片时只有「背景模糊」生效（遮罩没有东西可遮），
        有图片时模糊被 CSS 强制关掉，只有「背景遮罩」生效。
        每个控件都只在真正管用时出现，不留拖了没反应的死控件。
      -->
      <div class="field-label" id="mask-label">背景遮罩</div>
      <div class="slider-row" id="mask-row">
        <input id="mask-opacity" class="range" type="range" min="0" max="90" step="1"
               aria-label="背景遮罩浓度">
        <span id="mask-opacity-value" class="slider-value">28%</span>
      </div>

      <div class="field-label" id="blur-label">背景模糊</div>
      <div class="slider-row" id="blur-row">
        <input id="blur-level" class="range" type="range" min="0" max="20" step="1"
               aria-label="背景模糊强度">
        <span id="blur-level-value" class="slider-value">6px</span>
      </div>

      <div class="divider"></div>

      <div class="field-label">快捷键</div>
      <div class="hint" id="shortcut-hint">—</div>

      <div class="field-label">数据目录</div>
      <div class="hint path" id="data-dir">—</div>

      <div class="divider"></div>

      <div class="field-label">版本</div>
      <div class="hint" id="app-version">—</div>
      <div class="settings-actions">
        <button id="btn-check-update" class="btn">检查更新</button>
        <!--
          刻意用 <button> 而不是 <a target="_blank" href="...">：Tauri 的 webview
          不会把后者交给系统浏览器，要么什么都不做，要么直接在 webview 里导航 ——
          那会把整个界面顶掉。这里走 Rust 的 open_release_page。
        -->
        <button id="btn-open-release" class="btn" hidden>前往下载</button>
      </div>
      <div class="hint" id="update-status"></div>
    </div>
  </section>

  <!-- 标准文件选择器，比原生对话框插件少一层依赖，且不涉及任何权限配置 -->
  <input type="file" id="file-font" accept=".ttf,.otf" hidden>
  <input type="file" id="file-bg" accept="image/png,image/jpeg,image/webp" hidden>

  <div id="toast" class="toast" hidden role="status" aria-live="polite"></div>

  <script type="module" src="app.js"></script>
</body>
</html>
